scanner:
  volume_spike_ratio: 1.6
  rsi_overbought: 70
  rsi_oversold: 30
  breakout_lookback_days: 20
  min_history_days: 60
  gap_pct: 2.0
  # Index used for relative strength ("is this beating the market?").
  # ^FTSE = FTSE 100. Others: ^GSPC S&P 500 · ^GDAXI DAX · ^STOXX50E Euro Stoxx 50.
  # Leave blank to switch relative strength off.
  # US-only book, so the benchmark is the US market. This drives three things:
  # relative strength, low_beta's beta, and xs_momentum's market-trend overlay.
  # Pointing it at ^FTSE while trading US shares gave NVDA a beta of 0.43 —
  # weak cross-market correlation reading as defensiveness.
  benchmark: ^GSPC
  relative_strength_days: 63     # about three months of trading
  adx_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  squeeze_lookback_days: 120

# --- Market regime -----------------------------------------------------------
# Before any strategy runs, each ticker is labelled with the KIND of market it
# is in, and only the strategies that suit that market are allowed to look at
# it. Momentum says "buy strength", mean-reversion says "sell strength" — both
# are right, in different conditions, so they must never run blind together.
regime:
  adx_trend_min: 25.0            # ADX above this = a trend with real strength
  adx_chop_max: 20.0             # below this = definitively choppy
  squeeze_width_rank_max: 15.0   # band width in its bottom 15% = a squeeze
  squeeze_lookback_days: 120     # window the squeeze is measured against
  ma_slope_min_pct: 0.0          # the 200-day average must be turning the right way
  squeeze_overrides_trend: true  # a squeeze inside a trend is still a squeeze

# --- Strategies --------------------------------------------------------------
# Every strategy can be switched off with `enabled: false`, retuned by setting
# any of its own settings, or moved to different market conditions with
# `regimes:`. Deleting a block just restores that strategy's defaults.
#
# These are FACTOR strategies. They rebalance monthly, hold for weeks, and their
# signal is a rank or a sign rather than a chart pattern — so a scan on a
# non-rebalance day is meant to be silent, and a quiet week is the strategy
# working, not the strategy broken.
#
# Two of them need more than one ticker's data:
#   * xs_momentum ranks the watchlist against itself. A watchlist under
#     `min_universe` names produces nothing at all, by design.
#   * xs_momentum and low_beta both need `scanner.benchmark` set. Without it
#     there is no market to be low-beta against and no trend to stand aside
#     from, so they stay silent rather than guess.
strategies:
  # Cross-sectional momentum rotation — Jegadeesh & Titman (1993),
  # Asness-Moskowitz-Pedersen (2013), Daniel & Moskowitz (2016) for the overlay.
  xs_momentum:
    enabled: true
    # Registered in SIDEWAYS as well as TRENDING_UP deliberately. The regime
    # classifier labels the great majority of bars sideways at adx_trend_min 25,
    # and a monthly rotation gated on a per-ticker ADX reading is being filtered
    # twice — once by a measure it never asked for. Its own market-trend overlay
    # is the filter the research actually specifies.
    regimes: [TRENDING_UP, SIDEWAYS, VOLATILITY_SQUEEZE]
    lookback_bars: 252           # the 12 in "12-1": one trading year
    skip_bars: 21                # the 1: last month excluded, it mean-reverts
    top_n: 12                    # hold the top 10-15 of the ranking
    min_universe: 10             # fewer names than this is not a cross-section
    rebalance: weekly
    require_market_trend: true   # the anti-crash overlay; false = the raw 1993 rule
    max_vol_pct: 60.0            # skip a leader whose own vol has exploded
    stop_atr: 3.0                # wide: this holds for weeks, not days
    reward_multiple: 3.0
  # Time-series momentum / trend-following — Moskowitz, Ooi & Pedersen (2012).
  # Strongest on index ETFs and futures; a result from single mega-cap names is
  # not a test of this paper. Point it at index instruments to test it properly.
  ts_momentum:
    enabled: true
    regimes: [TRENDING_UP, TRENDING_DOWN, SIDEWAYS, VOLATILITY_SQUEEZE]
    # The only strategy here with a short leg, and it is switched off. Measured
    # over ten years on the watchlist: longs +£145,479, shorts -£68,694, and
    # turning shorts off moved portfolio CAGR from 2.93% to 9.13%. The rule now
    # goes FLAT on a negative trailing year instead of short, which is the
    # behaviour that makes it a diversifier rather than a drag.
    directions: [long]
    lookback_bars: 252
    min_abs_return_pct: 0.0      # 0 = the published rule, pure sign
    rebalance: weekly
    require_ma_agreement: true   # false = the unmodified 2012 rule
    max_vol_pct: 80.0
    stop_atr: 3.0
    reward_multiple: 3.0
  # Long-only low-beta / low-volatility tilt — Frazzini & Pedersen (2014),
  # Baker-Bradley-Wurgler (2011). The diversifier: it buys the end of the market
  # momentum ignores, so the two lose money at different times.
  low_beta:
    enabled: true
    regimes: [TRENDING_UP, SIDEWAYS, VOLATILITY_SQUEEZE]
    max_beta: 0.85               # moves 85% as much as its index, or less
    beta_lookback_bars: 252
    max_vol_rank_pct: 40.0       # the calmest 40% of the watchlist
    max_vol_pct: 30.0            # absolute fallback when there is no universe
    require_above_trend: true    # calm is not the same as rising
    rebalance: weekly
    stop_atr: 2.5
    reward_multiple: 2.5

# --- Paper trading -----------------------------------------------------------
# The rules trading forward with nobody intervening. `python run.py paper` runs
# one session: marks open positions, takes exits, and rebalances when a calendar
# month turns. It places no orders — there is no broker in that code path.
#
# Distinct from the journal, which records ideas YOU decide on. This measures
# the rules; the journal measures you. Keeping them apart is what lets you tell
# a good month from good judgement.
paper:
  starting_equity: null       # null = account.portfolio_value
  # A paper book holds ONE cash balance, so every instrument in it must price in
  # one currency. US shares are dollars. The account is in GBP, so the opening
  # balance is converted once at the rate on the day the book starts and the
  # book runs in USD from there — otherwise its return would measure the
  # strategy plus the exchange rate, and you could not tell which was which.
  trading_currency: USD
  # How often new positions may be OPENED. Exits are taken every session
  # regardless of this — a stop is never left waiting for a rebalance day.
  #
  #   monthly  (was the only behaviour) · weekly · daily · half_day
  #
  # Set to half_day on 2026-08-17. Be clear about what that changes and what it
  # does not: every strategy here ranks on DAILY bars — a trailing year of
  # returns, a 200-day average — and those inputs are identical between two runs
  # on the same day. The second run therefore produces the SAME ranking as the
  # first and cannot find a different set of names.
  #
  # What it does buy is capital turnover. The rebalance step only ever opens
  # positions, so under `monthly` a slot freed by a stop on the 3rd stood empty
  # until the 1st of the next month. Now it refills the same day. Names already
  # held are skipped, so running more often does not churn the book or pay
  # commission twice for a position it already owns.
  #
  # Picking different names intraday would need the strategies rebuilt on
  # intraday bars, which would also invalidate every backtest figure in this
  # file — those were all measured on daily data.
  rebalance_every: half_day
  half_day_split_hour_utc: 12   # windows are [00:00,12:00) and [12:00,24:00) UTC
  # Reuse a recent universe history fetch instead of walking IBKR again.
  # The fetch is ~1.44s per instrument, so 1,560 names costs ~38 minutes. Paid
  # once a month that was tolerable; at half_day it would be 76 minutes of
  # continuous pulling every day, which is not a schedule anyone would leave
  # running. Safe because the strategies rank on 252-day lookbacks — between two
  # runs on the same day the only bar that can differ is today's still-forming
  # one, and one partial bar at the end of a 252-bar window does not move a
  # ranking. Keyed on the exact symbol set, so re-screening invalidates it.
  # Set to 0 to always re-fetch.
  universe_history_cache_hours: 8
  max_holding_bars: 10        # ~2 weeks, not ~2 months
  slippage_bps: 5.0           # charged against you on entry AND exit
  history_period: 2y          # 12-month signal + 200-day average needs ~1.5y
  screen:
    # "us_all" is every symbol in the cached Finnhub US listing (~28,000).
    # "watchlist" restricts to config.watchlist. A list of symbols also works.
    universe: us_all
    # Without these a momentum ranking over 28,000 symbols reliably puts a
    # sub-dollar shell that tripled on one news day at the top, every month.
    # A random sample of forty symbols from that list returned four already
    # delisted. These are what make the universe tradable rather than merely
    # large; turning the screen off is a real choice with a real consequence.
    enabled: true
    min_price: 5.0
    min_dollar_volume: 5000000   # MEDIAN daily traded value, not mean
    min_history_bars: 60
    # Applied after screening, most liquid first. Raise it for a wider book;
    # the cost is the monthly history fetch, ~0.16s per instrument.
    max_symbols: 1500
    liquidity_period: 3mo

# --- Interactive Brokers as a DATA source ------------------------------------
# Separate from IBKR as a broker (execution:, below). This is prices, contract
# specifications and option chains, and it fixes three things yfinance cannot:
#
#   * LICENCE — yfinance forbids commercial use; an IBKR subscription is
#     licensed to the account holder.
#   * DELISTED NAMES — yfinance has forgotten every instrument that stopped
#     trading. long_reversal buys multi-year losers, so it is measured against a
#     universe with its worst outcomes deleted. IBKR keeps those contracts.
#   * OPTIONS — the only route to a defined-risk hedge. Nothing in the current
#     book is negatively correlated with anything else.
#
# Needs IB Gateway or TWS running and logged in (a paper account is enough for
# data), with API access enabled in its settings. Ports: 7497 paper TWS,
# 7496 live TWS, 4002 paper Gateway, 4001 live Gateway.
#
# WITHOUT a market-data subscription IBKR returns delayed or empty data rather
# than an error you would notice. Run `python run.py ibkr-data-check` before
# trusting any study run against it.
# --- Kelly position sizing ---------------------------------------------------
# How much of the book one position gets. Kelly maximises long-run growth and is
# only optimal if you know the edge exactly, which you never do — so every entry
# here exists to close the gap between the formula and what can be estimated.
kelly:
  # ON. Sizing still comes from OUT-OF-SAMPLE returns only — the module
  # refuses an in-sample edge outright — so a strategy with no out-of-sample
  # estimate yet falls back to the fixed-risk sizer rather than going unsized.
  enabled: true
  # NEVER full Kelly. Quarter gives up about a quarter of the theoretical growth
  # rate for roughly a sixteenth of the variance in outcomes; that is a good
  # trade with an estimated edge. max_fraction is a hard ceiling on this value.
  fraction: 0.25
  max_fraction: 0.5
  # "lcb" sizes from a lower-confidence bound on the mean rather than the mean:
  # bet the edge you can nearly prove, not the one you measured. Kelly is linear
  # in the edge and the damage from overestimating it is quadratic.
  shrinkage: lcb
  confidence_z: 1.0
  # Below this many out-of-sample observations, an edge estimate is noise with a
  # number attached and sizing is refused rather than rounded to zero.
  min_observations: 30
  # Absolute ceiling on any one position, whatever Kelly says. The caps sit
  # ABOVE Kelly, not beside it.
  max_position_fraction: 0.15

# --- Blending ----------------------------------------------------------------
# Equal-weighting everything is an average, not diversification: running all
# twelve strategies together returned less than four of them individually and
# produced the deepest drawdown in the study. A blend selects on two axes —
# positive out-of-sample edge AND low correlation to what is already held.
blend:
  max_correlation: 0.6      # a second copy of the best strategy adds risk, not return
  max_strategies: 4

# --- Backtesting -------------------------------------------------------------
# Replays the strategies over history so you can see whether a rule set has an
# edge without waiting months. Assumptions are deliberately pessimistic: a
# backtest that flatters itself is worse than none at all.
backtest:
  warmup_bars: 260            # no signals until the 200-day average is real
  history_window_bars: 400    # lookback per bar; every indicator fits inside this
  # Abandon a trade that goes nowhere. This is now the dominant exit for a
  # factor library: the ATR stops and targets are wide on purpose, so most
  # positions leave here, roughly two rebalances after they were opened. Raising
  # it lengthens the holding period; lowering it turns a monthly strategy into
  # something the research it cites does not describe.
  max_holding_bars: 40
  # next_open  = enter at the open AFTER the signal (honest — you only knew at the close)
  # signal_close = enter at the signal bar's close (optimistic; for comparison only)
  entry_timing: next_open
  one_position_per_ticker: true
  costs:
    commission_per_trade: 6.0   # per side, your broker's flat fee
    slippage_bps: 5.0           # 0.05% against you on entry AND exit
    stamp_duty_pct: 0.5         # UK stamp duty, charged on purchases only
    stamp_duty_suffixes: ['.L']  # exchanges where that duty applies
    # Costs are NOT the same everywhere. UK shares carry 0.5% stamp duty and a
    # higher flat fee; US shares carry neither. Applying one market's structure
    # globally is how a UK tax gets mistaken for a flaw in a strategy.
    # Keyed by ticker suffix; '' means no suffix (US listings).
    per_market:
      '':     {commission_per_trade: 1.0}    # US — IBKR is about $1
      '.L':   {commission_per_trade: 6.0}    # London
      '.DE':  {commission_per_trade: 4.0}    # Xetra
      '.PA':  {commission_per_trade: 4.0}    # Paris
      '.AS':  {commission_per_trade: 4.0}    # Amsterdam
      '.SW':  {commission_per_trade: 10.0}   # Switzerland
      '.MI':  {commission_per_trade: 4.0}    # Milan
      '.T':   {commission_per_trade: 5.0}    # Tokyo
      '.HK':  {commission_per_trade: 5.0}    # Hong Kong
      '.AX':  {commission_per_trade: 6.0}    # Sydney
      '.TO':  {commission_per_trade: 1.0}    # Toronto

# --- Portfolio limits (backtest) ---------------------------------------------
# Without these the backtest sizes every instrument against the whole book, so
# running 90 instruments quietly holds ~14 positions at once — about 2x leverage
# the live risk gate would refuse. Leverage should be a decision, not an accident.
portfolio:
  compound: true                  # position size scales with CURRENT equity
  # Measured, not guessed. The 10-market sweep: returns rise all the way to
  # 100% exposure but drawdown rises faster, so risk-adjusted return (Calmar)
  # peaks at 90%. Going 90 -> 100 buys 0.11 points of CAGR for 3 points of
  # drawdown, which is a bad trade at any risk appetite.
  #   50%: 3.76% CAGR / 15.9% DD   80%:  6.51% / 21.0%
  #   60%: 4.55% / 17.5%           90%:  7.44% / 22.7%  <- best Calmar 0.33
  #   70%: 5.04% / 18.3%          100%:  7.55% / 25.8%     Calmar 0.29
  max_gross_exposure_pct: 90.0
  max_open_positions: 60
  # Per-position cap for the PAPER BOOK, deliberately separate from
  # account.max_position_pct (15%), which still governs the live risk gate.
  #
  # Why this exists: max_open_positions was 60 and the book held SEVEN. The
  # position count was never the binding constraint — the 90% gross exposure
  # budget was, and at 15% per position that budget is exhausted by six or
  # seven names. Raising the position cap could not have changed that, because
  # the two limits multiply: 90% / 15% = 6 positions, and no amount of
  # headroom on the count adds a seventh idea's worth of room.
  #
  # So the way to hold more positions WITHOUT loosening any risk limit is to
  # make each one smaller. Total exposure stays at 90%, risk per trade stays at
  # 1%, the correlation cap still bites; the same capital is simply spread over
  # ~22 names instead of 7, which is the diversification the correlation
  # threshold below was already trying to achieve and could not.
  #
  # 2026-08-17, second change: 4.0 -> 2.0. At 4% the 90% budget was exhausted by
  # 24 names and the book sat at 90.03% gross with 926 candidates refused for
  # exposure — full, not selective. Halving the position halves what each name
  # consumes, so the SAME budget spreads across roughly 45.
  #
  #   90% gross ÷ 4.0% = ~22 positions      90% ÷ 2.0% = ~45 positions
  #
  # Note this does not add risk: gross exposure is still capped at 90%, risk per
  # trade is still 1%, and the correlation cap still bites. The same capital is
  # simply divided more ways, which is the direction that reduces single-name
  # concentration rather than increasing it. max_open_positions (60) still has
  # headroom above 45, so the count remains a backstop rather than the binding
  # limit — the exposure budget continues to do the real work.
  #
  # NOT YET MEASURED, unlike every other number in this block. The exposure and
  # per-market caps above carry sweep results because they were swept; this one
  # is reasoned from the arithmetic above. Sweep it before trusting it:
  #   python run.py backtest --years 10
  # and compare CAGR/drawdown at 1.5, 2, 3, 4 and 15 percent. More names is not
  # automatically better: past some point the marginal position is a worse idea
  # than the one it dilutes, and each one still pays commission and slippage.
  max_position_pct: 2.0
  # 8, measured. A cap of 4 cost 0.66 points of CAGR by blocking good trades;
  # 2 was far worse (2.87%). Above 8 adds nothing. Correlation is the better
  # tool for this job anyway — it measures whether positions actually move
  # together instead of guessing from the exchange they list on.
  max_positions_per_market: 25
  max_new_entries_per_day: null   # null = unlimited
  # Tested at 0.8 and it COST return (7.44% -> 6.63%) while drawdown got
  # slightly worse. Left off until there is evidence for it.
  # Position COUNT is a poor proxy for risk. Six mega-cap tech names bought on
  # the same rebalance are one bet with six tickets, and that is exactly what
  # the 2021-11 to 2023-10 drawdown was: AAPL, AMD, AMZN, META, MSFT and NVDA
  # open together. Momentum buys what has gone up, which on this watchlist is
  # always the same cluster, so this cap is doing real work rather than
  # guarding against a hypothetical.
  #
  # Only bites when the caller passes `returns_lookup` into portfolio.simulate.
  # `run.py backtest` does not run the portfolio layer at all, so this setting
  # has no effect on that command's output.
  correlation_threshold: 0.8
  correlation_lookback: 60

# --- Market-wide trend filter ------------------------------------------------
# Separate from the per-ticker regime classifier: this asks "should I be buying
# ANYTHING right now", gated on each region's own index. Buying dips while the
# whole market falls is what lost money in 2018 and 2020.
market_filter:
  enabled: true
  # US only. An unmapped suffix returns NO index rather than falling back to the
  # S&P, so if a non-US ticker ever appears it goes ungated instead of being
  # gated on the wrong market — which would look like a working filter while
  # measuring a different continent. Restore the other entries from
  # research/market_regime.py DEFAULTS to trade those markets again.
  indices:
    '': ^GSPC
  ma_period: 200
  reentry_buffer_pct: 2.0         # must clear the average by this to buy back in
  risk_off_action: half_size      # half_size | skip — half measured better on both
  risk_off_size_multiplier: 0.5
  volatility_percentile_max: 95.0  # a crash can outrun a 200-day average
  volatility_lookback: 120

# --- Short-selling rules -----------------------------------------------------
# Extra rules that apply ONLY to shorts, on top of every normal risk check.
# A long can only lose what you put in; a short cannot be capped that way, so
# it needs a stop, a borrow check, and tighter limits.
short_rules:
  require_stop: true                  # a short without a stop is always refused
  max_short_position_pct: 8.0         # tighter than the 15% long cap, on purpose
  max_total_short_exposure_pct: 25.0
  max_open_shorts: 3
  crowding_flag_pct: 10.0             # flag when this % of float is already short
  # Borrow availability can't be confirmed from free data. false = flag it and
  # let you check with your broker; true = refuse any short you haven't verified.
  block_if_borrow_unknown: false
  # Your own verified list, checked before anything else. Add tickers here once
  # you know from your broker whether they can be shorted.
  #   shortable_overrides:
  #     TSCO.L: true
  #     SMALLCAP.L: false
  shortable_overrides: {}
macro_events: []
ai:
  enabled: true
  model: claude-sonnet-5
providers:
  # Interactive Brokers as a DATA source — separate from IBKR as a broker.
  # Fixes three things yfinance cannot: its data is licensed for commercial
  # use, it keeps contracts for DELISTED instruments (long_reversal buys
  # multi-year losers, so yfinance measures it against a universe with its
  # worst outcomes deleted), and it serves option chains — the only route to a
  # defined-risk hedge in a book where nothing is negatively correlated.
  #
  # Needs IB Gateway or TWS running and logged in; a paper account is enough
  # for data. Ports: 7497 paper TWS · 7496 live TWS · 4002 paper Gateway ·
  # 4001 live Gateway. Without a market-data subscription IBKR returns delayed
  # or empty data rather than an error you would notice, so run
  # `python run.py ibkr-data-check` before trusting a study run against it.
  ibkr:
    enabled: true
    host: 127.0.0.1
    port: 7497
    data_client_id: 991     # distinct from the broker's, so both can connect
  cache_ttl_seconds:
    prices: 600
    fundamentals: 3600
    news: 3600
    earnings: 3600
    macro: 21600
    fx: 3600
  finnhub_max_calls_per_min: 55
server:
  port: 5002
execution:
  # NOTE: `enabled` is the one key here the dashboard can change, and it is
  # stored in state.yaml, not this file. The value below is the seed used the
  # first time state.yaml is created; after that state.yaml wins. Nothing else
  # in this file is ever written by the program — that is what keeps these
  # comments alive.
  enabled: false
  host: 127.0.0.1
  # The only IB port listening on this machine. The port does NOT decide paper
  # vs live: 7497 is conventionally the paper port, but a live account has been
  # served on this exact port before. Paper is proven by the account id
  # starting with DU, and by nothing else.
  port: 7497
  client_id: 42
  # Pinned to your UK PAPER account. If Gateway is ever logged into a live
  # account instead, the app refuses to connect rather than quietly reading —
  # or trading — the wrong one.
  # Can also be set as IBKR_ACCOUNT in .env, which wins over this value — use
  # that if you ever want to share or publish config.yaml, since an account
  # number is identifying data.
  account: DUR673876

  # --- Daily circuit breaker ---------------------------------------------
  # Every other gate in this app is per-order, and per-order confirmation is
  # what makes runaway automation impossible. Neither does anything about a
  # bad day compounded by clicking through ten tickets in a row, which is the
  # realistic failure mode for a human trader.
  #
  # Both are optional: comment either out for no limit. Both are checked when
  # a ticket is PREPARED, so you are stopped before you see a confirmation
  # box rather than after.
  #
  # Counted per UTC day. max_orders_per_day counts orders that actually
  # reached the broker — preparing a ticket and cancelling it costs nothing.
  max_orders_per_day: 5
  # Realised losses booked today as a percentage of the account. Only trades
  # you have closed in the journal count, so this is a backstop and not a
  # live drawdown monitor. At 1% risk per trade, 3% is roughly three
  # full stop-outs: a bad day, and a reasonable point to stop and think.
  max_daily_loss_pct: 3.0
